<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila da Live - Walkblade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      color: #38bdf8;
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .form-group {
        flex-direction: row;
      }
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      width: 100%;
    }

    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    
    .btn-success { background: #22c55e; }
    .btn-success:hover { background: #16a34a; }

    .admin-panel {
      border: 2px dashed #38bdf8;
      display: none;
    }

    .admin-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .table-container {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #334155;
      font-size: 0.95rem;
    }

    th {
      background: #0f172a;
      color: #38bdf8;
    }

    .status-espera { color: #facc15; font-weight: bold; }
    .status-jogando { color: #4ade80; font-weight: bold; }

    .actions-cell {
      display: flex;
      gap: 5px;
    }

    .actions-cell button {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .admin-toggle {
      background: transparent;
      color: #64748b;
      font-size: 0.8rem;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Fila da Live - Walkblade</h1>
    <p>Cadastre seu nick para jogar com a gente!</p>
  </header>

  <!-- FORMULÁRIO DE INSCRIÇÃO -->
  <div class="card">
    <div class="form-group">
      <input type="text" id="nickInput" placeholder="Seu Nick do Jogo/TikTok" maxlength="20">
      <button onclick="entrarNaFila()">Entrar na Fila</button>
    </div>
  </div>

  <!-- PAINEL DE ADMIN -->
  <div class="card admin-panel" id="adminPanel">
    <h3>👑 Painel de Controle (Admin)</h3>
    <div class="admin-controls">
      <button class="btn-danger" onclick="limparFila()">Limpar Fila Toda</button>
    </div>
  </div>

  <!-- LISTA DA FILA -->
  <div class="card">
    <h2>📋 Fila de Espera</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nick</th>
            <th>Status</th>
            <th class="admin-only" style="display:none;">Ações</th>
          </tr>
        </thead>
        <tbody id="filaBody">
          <tr><td colspan="4">Carregando fila...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <button class="admin-toggle" onclick="toggleAdmin()">Acessar Modop Admin</button>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Suas configurações do Firebase conectadas!
    const firebaseConfig = {
      apiKey: "AIzaSyB107R20K5NeJvEydhncZA0zJqe50MG9P4",
      authDomain: "walkblade-fila.firebaseapp.com",
      databaseURL: "https://walkblade-fila-default-rtdb.firebaseio.com",
      projectId: "walkblade-fila",
      storageBucket: "walkblade-fila.firebasestorage.app",
      messagingSenderId: "187103264773",
      appId: "1:187103264773:web:7e52f9294d72e4fa3c5c6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const filaRef = ref(db, 'fila');

    let isAdmin = false;

    // Adicionar Jogador
    window.entrarNaFila = function() {
      const nickInput = document.getElementById('nickInput');
      const nick = nickInput.value.trim();

      if (!nick) {
        alert('Digite o seu nick!');
        return;
      }

      push(filaRef, {
        nick: nick,
        status: 'Aguardando',
        timestamp: Date.now()
      }).then(() => {
        nickInput.value = '';
      });
    };

    // Escutar alterações na Fila em Tempo Real
    onValue(filaRef, (snapshot) => {
      const filaBody = document.getElementById('filaBody');
      filaBody.innerHTML = '';

      if (!snapshot.exists()) {
        filaBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Fila vazia no momento!</td></tr>';
        return;
      }

      let pos = 1;
      snapshot.forEach((childSnapshot) => {
        const key = childSnapshot.key;
        const data = childSnapshot.val();

        const tr = document.createElement('tr');
        
        let statusClass = data.status === 'Jogando' ? 'status-jogando' : 'status-espera';
        let adminActionButtons = isAdmin ? `
          <td class="actions-cell">
            <button class="btn-success" onclick="mudarStatus('${key}', 'Jogando')">Chamar</button>
            <button class="btn-danger" onclick="removerJogador('${key}')">X</button>
          </td>
        ` : `<td class="admin-only" style="display:none;"></td>`;

        tr.innerHTML = `
          <td>${pos++}</td>
          <td>${data.nick}</td>
          <td class="${statusClass}">${data.status}</td>
          ${adminActionButtons}
        `;

        filaBody.appendChild(tr);
      });
      
      atualizarVisibilidadeAdmin();
    });

    // Ações de Admin
    window.mudarStatus = function(key, novoStatus) {
      update(ref(db, `fila/${key}`), { status: novoStatus });
    };

    window.removerJogador = function(key) {
      remove(ref(db, `fila/${key}`));
    };

    window.limparFila = function() {
      if (confirm('Tem certeza que quer apagar a fila inteira?')) {
        remove(filaRef);
      }
    };

    // Ativar/Desativar modo Admin
    window.toggleAdmin = function() {
      const senha = prompt('Digite a senha de Admin:');
      if (senha === '1234') { // Você pode trocar '1234' pela senha que quiser!
        isAdmin = !isAdmin;
        document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
        alert(isAdmin ? 'Modo Admin Ativado!' : 'Modo Admin Desativado!');
        atualizarVisibilidadeAdmin();
      } else if (senha !== null) {
        alert('Senha incorreta!');
      }
    };

    function atualizarVisibilidadeAdmin() {
      const adminElements = document.querySelectorAll('.admin-only');
      adminElements.forEach(el => {
        el.style.display = isAdmin ? 'table-cell' : 'none';
      });
    }
  </script>
</body>
</html>

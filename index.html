    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB107R20K5NeJvEydhncZA0zJqe50MG9P4",
      authDomain: "walkblade-fila.firebaseapp.com",
      databaseURL: "https://walkblade-fila-default-rtdb.firebaseio.com",
      projectId: "walkblade-fila",
      storageBucket: "walkblade-fila.firebasestorage.app",
      messagingSenderId: "187103264773",
      appId: "1:187103264773:web:7e52f9294d72e4fa3c5c6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const filaRef = ref(db, 'fila');
    const statusFilaRef = ref(db, 'config/filaAberta');

    let isAdmin = false;
    let filaAberta = true;
    const SENHA_ADMIN = "1574";

    const form = document.getElementById('filaForm');
    let listaKeys = []; 
    let filaLocal = []; 

    onValue(statusFilaRef, (snapshot) => {
      if (snapshot.exists()) {
        filaAberta = snapshot.val();
      } else {
        filaAberta = true;
      }
      atualizarEstadoFormulario();
    });

    function atualizarEstadoFormulario() {
      const inputNick = document.getElementById('nickname');
      const selectElemental = document.getElementById('elemental');
      const btnSubmit = document.querySelector('#filaForm button[type="submit"]');
      const avisoPixDiv = document.querySelector('.aviso-pix-container');

      if (!filaAberta && !isAdmin) {
        inputNick.disabled = true;
        selectElemental.disabled = true;
        btnSubmit.disabled = true;
        btnSubmit.style.opacity = "0.5";
        btnSubmit.style.cursor = "not-allowed";
        btnSubmit.innerText = "Fila Encerrada pelo Host";
        avisoPixDiv.innerHTML = `<span class="aviso-pix" style="color: #ff4d4d; width: 100%;">⚠️ A fila está encerrada no momento!</span>`;
      } else {
        inputNick.disabled = false;
        selectElemental.disabled = false;
        btnSubmit.disabled = false;
        btnSubmit.style.opacity = "1";
        btnSubmit.style.cursor = "pointer";
        btnSubmit.innerText = "Entrar na Fila";
        avisoPixDiv.innerHTML = `
          <span class="aviso-pix">Clique no botão Roxo da Live P!X e "Fure a Fila", a fila ainda segue de acordo!</span>
          <a href="https://livepix.gg/walkblade" target="_blank" class="btn-live-pix">⚡ Live P!X</a>
        `;
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!filaAberta && !isAdmin) {
        alert("A fila está encerrada!");
        return;
      }

      const nick = document.getElementById('nickname').value;
      const elemental = document.getElementById('elemental').value;

      push(filaRef, {
        nick: nick,
        elemental: elemental,
        chamado: false,
        furaFilaOrder: 0,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('nickname').value = '';
        document.getElementById('elemental').value = '';
      });
    });

    onValue(filaRef, (snapshot) => {
      const itens = [];

      if (snapshot.exists()) {
        snapshot.forEach((child) => {
          itens.push({
            key: child.key,
            data: child.val()
          });
        });

        itens.sort((a, b) => {
          const orderA = a.data.furaFilaOrder || 0;
          const orderB = b.data.furaFilaOrder || 0;

          if (orderA > 0 && orderB > 0) {
            return orderA - orderB;
          }
          if (orderA > 0) return -1;
          if (orderB > 0) return 1;
          
          return (a.data.timestamp || 0) - (b.data.timestamp || 0);
        });
      }

      listaKeys = itens.map(item => item.key);
      filaLocal = itens.map(item => item.data);

      atualizarTabela();
    });

    window.atualizarTabela = function() {
      const tabela = document.getElementById('tabelaFila');
      tabela.innerHTML = '';

      if (filaLocal.length === 0) {
        tabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Fila vazia no momento.</td></tr>`;
        return;
      }

      filaLocal.forEach((jogador, index) => {
        const tr = document.createElement('tr');

        if (jogador.chamado) {
          tr.classList.add('jogador-ativo');
        } else if (jogador.furaFilaOrder > 0) {
          tr.classList.add('jogador-fura-fila');
        }

        let acoesHTML = '';
        let nicknameConteudo = `<strong>${jogador.nick}</strong>`;

        if (isAdmin) {
          const btnFuraTexto = (jogador.furaFilaOrder > 0) ? '↩️ Normal' : '⚡ Fura Fila';
          acoesHTML = `
            <button class="badge-base btn-action btn-chamar" onclick="chamarJogador(${index})">
              ${jogador.chamado ? 'Desmarcar' : 'Chamar'}
            </button>
            <button class="badge-base btn-action btn-fura" onclick="furarFilaJogador(${index})">
              ${btnFuraTexto}
            </button>
            <button class="badge-base btn-action btn-editar" onclick="editarElemental(${index})">✏️ Editar</button>
            <button class="badge-base btn-action btn-finalizar" onclick="removerJogador(${index})">Finalizar 🠳</button>
          `;

          let statusBadgeAbaixo = '';
          if (jogador.chamado) {
            statusBadgeAbaixo = `<div style="margin-top: 4px;"><span class="badge-base status-agora" style="font-size: 0.65rem; padding: 2px 6px;"><span class="bolinha bolinha-verde"></span> Agora</span></div>`;
          } else if (jogador.furaFilaOrder > 0) {
            statusBadgeAbaixo = `<div style="margin-top: 4px;"><span class="badge-base status-furou" style="font-size: 0.65rem; padding: 2px 6px;"><span class="bolinha bolinha-roxa"></span> ⚡ #${jogador.furaFilaOrder}</span></div>`;
          } else {
            statusBadgeAbaixo = `<div style="margin-top: 4px;"><span class="badge-base status-aguardando" style="font-size: 0.65rem; padding: 2px 6px;"><span class="bolinha bolinha-amarela"></span> Espera</span></div>`;
          }

          nicknameConteudo += statusBadgeAbaixo;

        } else {
          if (jogador.chamado) {
            acoesHTML = `<span class="badge-base status-agora"><span class="bolinha bolinha-verde"></span> Agora</span>`;
          } else if (jogador.furaFilaOrder > 0) {
            acoesHTML = `<span class="badge-base status-furou"><span class="bolinha bolinha-roxa"></span> ⚡ #${jogador.furaFilaOrder} Fura Fila</span>`;
          } else {
            acoesHTML = `<span class="badge-base status-aguardando"><span class="bolinha bolinha-amarela"></span> Espera</span>`;
          }
        }

        tr.innerHTML = `
          <td><strong>#${index + 1}</strong></td>
          <td>${nicknameConteudo}</td>
          <td>${jogador.elemental}</td>
          <td>${acoesHTML}</td>
        `;

        tabela.appendChild(tr);
      });
    };

    window.toggleAdmin = function() {
      if (!isAdmin) {
        const senha = prompt("Digite a senha de Admin:");
        if (senha === SENHA_ADMIN) {
          isAdmin = true;
          document.getElementById('btnAdmin').innerText = "Sair do Modo Admin";
          document.getElementById('btnEncerrarFila').style.display = "inline-flex";
          document.getElementById('btnReabrirFila').style.display = "inline-flex";
          alert("Modo Admin ativado!");
        } else if (senha !== null) {
          alert("Senha incorreta!");
        }
      } else {
        isAdmin = false;
        document.getElementById('btnAdmin').innerText = "Entrar como Admin";
        document.getElementById('btnEncerrarFila').style.display = "none";
        document.getElementById('btnReabrirFila').style.display = "none";
      }
      atualizarTabela();
      atualizarEstadoFormulario();
    };

    window.alternarStatusFila = function(status) {
      update(ref(db, 'config'), { filaAberta: status }).then(() => {
        alert(status ? "Fila reaberta com sucesso!" : "Fila encerrada com sucesso!");
      });
    };

    window.chamarJogador = function(index) {
      const key = listaKeys[index];
      const novoStatus = !filaLocal[index].chamado;
      update(ref(db, `fila/${key}`), { chamado: novoStatus });
    };

    window.furarFilaJogador = function(index) {
      const key = listaKeys[index];
      const jogadorAtual = filaLocal[index];

      if (jogadorAtual.furaFilaOrder > 0) {
        // Se já tem ordem de fura fila, desativa (volta para a fila normal por timestamp)
        update(ref(db, `fila/${key}`), { furaFilaOrder: 0 });
      } else {
        // Pega todos os registros do banco para calcular o próximo número sequencial (#1, #2, #3...)
        get(filaRef).then((snapshot) => {
          let maxOrder = 0;
          if (snapshot.exists()) {
            snapshot.forEach((child) => {
              const val = child.val();
              if (val.furaFilaOrder && val.furaFilaOrder > maxOrder) {
                maxOrder = val.furaFilaOrder;
              }
            });
          }
          const proximaOrdem = maxOrder + 1;
          update(ref(db, `fila/${key}`), { furaFilaOrder: proximaOrdem });
        });
      }
    };

    window.editarElemental = function(index) {
      const key = listaKeys[index];
      const novoElemental = prompt(`Digite exatamente o novo elemental para ${filaLocal[index].nick}:`, filaLocal[index].elemental);

      if (novoElemental !== null && novoElemental.trim() !== "") {
        update(ref(db, `fila/${key}`), { elemental: novoElemental });
      }
    };

    window.removerJogador = function(index) {
      const key = listaKeys[index];
      remove(ref(db, `fila/${key}`));
    };
  </script>
</body>
</html>

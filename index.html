<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila de espera - Walkblade Segue nois no Tik Tok</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #ffffff;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2 { text-align: center; color: #00d4ff; }

    .card {
      background-color: #202024;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label { display: block; margin-bottom: 5px; font-weight: bold; }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #323238;
      background-color: #121214;
      color: #fff;
      box-sizing: border-box;
    }

    button.btn-principal {
      background-color: #00d4ff;
      color: #121214;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    button.btn-principal:hover { background-color: #0099cc; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #323238;
    }

    th { background-color: #29292e; color: #00d4ff; }

    .admin-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    /* ESTILOS PADRONIZADOS (PILULA DE STATUS E BOTÕES TEMÁTICOS) */
    .badge-base {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .bolinha {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* STATUS: AGORA (VERDE) */
    .status-agora {
      background-color: #04d3611a;
      color: #04d361;
      border: 1px solid #04d361;
    }

    .bolinha-verde {
      background-color: #04d361;
      box-shadow: 0 0 8px #04d361;
    }

    /* STATUS: AGUARDANDO (AMARELO) */
    .status-aguardando {
      background-color: #fba94c1a;
      color: #fba94c;
      border: 1px solid #fba94c;
    }

    .bolinha-amarela {
      background-color: #fba94c;
      box-shadow: 0 0 8px #fba94c;
    }

    /* BOTÕES DO MODO ADMIN */
    .btn-action {
      cursor: pointer;
      width: auto;
    }

    .btn-action.btn-chamar {
      background-color: #04d3611a;
      color: #04d361;
      border: 1px solid #04d361;
    }

    .btn-action.btn-chamar:hover {
      background-color: #04d361;
      color: #121214;
    }

    .btn-action.btn-editar {
      background-color: #00d4ff1a;
      color: #00d4ff;
      border: 1px solid #00d4ff;
    }

    .btn-action.btn-editar:hover {
      background-color: #00d4ff;
      color: #121214;
    }

    .btn-action.btn-finalizar {
      background-color: #ff79c61a;
      color: #ff9933;
      border: 1px solid #ff9933;
    }

    .btn-action.btn-finalizar:hover {
      background-color: #ff9933;
      color: #121214;
    }

    /* Destaque para a linha dos jogadores ativos */
    tr.jogador-ativo {
      background-color: #04d3610d;
    }
  </style>
</head>

  <!-- TABELA DA FILA -->
  <div class="card">
    <div class="admin-controls">
      <button id="btnAdmin" class="btn-principal" style="width: auto;" onclick="toggleAdmin()">Entrar como Host / Admin</button>
    </div>
    
    <h2>Fila Atual</h2>
    <table>
      <thead>
        <tr>
          <th>Posição</th>
          <th>Nickname</th>
          <th>Elemental</th>
          <th>Chamadas</th>
        </tr>
      </thead>
      <tbody id="tabelaFila">
        <!-- Os inscritos aparecerão aqui automaticamente -->
      </tbody>
    </table>
  </div>

  <script>
    let fila = [];
    let isAdmin = false;
    const SENHA_ADMIN = "1574";

    const form = document.getElementById('filaForm');
    const tabela = document.getElementById('tabelaFila');

    // Função para adicionar à fila
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const nick = document.getElementById('nickname').value;
      const elemental = document.getElementById('elemental').value;

      fila.push({ nick, elemental, chamado: false });

      document.getElementById('nickname').value = '';
      document.getElementById('elemental').value = '';

      atualizarTabela();
    });

    // Função para atualizar a visualização da fila
    function atualizarTabela() {
      tabela.innerHTML = '';

      if (fila.length === 0) {
        tabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Fila vazia no momento.</td></tr>`;
        return;
      }

      fila.forEach((jogador, index) => {
        const tr = document.createElement('tr');

        if (jogador.chamado) {
          tr.classList.add('jogador-ativo');
        }

        let acoesHTML = '';
        
        // Se for admin, mostra os botões temáticos
        if (isAdmin) {
          acoesHTML = `
            <button class="badge-base btn-action btn-chamar" onclick="chamarJogador(${index})">
              ${jogador.chamado ? 'Desmarcar' : 'Chamar'}
            </button>
            <button class="badge-base btn-action btn-editar" onclick="editarElemental(${index})">✏️ Editar</button>
            <button class="badge-base btn-action btn-finalizar" onclick="removerJogador(${index})">Finalizar 🠳</button>
          `;
        } else {
          acoesHTML = jogador.chamado 
            ? `<span class="badge-base status-agora"><span class="bolinha bolinha-verde"></span> Agora</span>` 
            : `<span class="badge-base status-aguardando"><span class="bolinha bolinha-amarela"></span> Aguardando</span>`;
        }

        // Mostra o badge "Agora" para o Admin identificar visualmente quem está em jogo
        const badgeAgora = jogador.chamado && isAdmin 
          ? ` <span class="badge-base status-agora"><span class="bolinha bolinha-verde"></span> Agora</span>` 
          : '';

        tr.innerHTML = `
          <td><strong>#${index + 1}</strong></td>
          <td>${jogador.nick} ${badgeAgora}</td>
          <td>${jogador.elemental}</td>
          <td>${acoesHTML}</td>
        `;

        tabela.appendChild(tr);
      });
    }

    // Ativar Modo Admin
    function toggleAdmin() {
      if (!isAdmin) {
        const senha = prompt("Digite a senha de Admin:");
        if (senha === SENHA_ADMIN) {
          isAdmin = true;
          document.getElementById('btnAdmin').innerText = "Sair do Modo Admin";
          alert("Modo Admin ativado!");
        } else if (senha !== null) {
          alert("Senha incorreta!");
        }
      } else {
        isAdmin = false;
        document.getElementById('btnAdmin').innerText = "Entrar como Host / Admin";
      }
      atualizarTabela();
    }

    // Ação do Botão Chamar (Agora permite múltiplos chamados)
    function chamarJogador(index) {
      // Inverte o estado atual do jogador (se estava falso vira verdadeiro, se estava verdadeiro vira falso)
      fila[index].chamado = !fila[index].chamado;
      atualizarTabela();
    }

    // Editar Elemental
    function editarElemental(index) {
      const novoElemental = prompt(`Digite exatamente o novo elemental para ${fila[index].nick}:`, fila[index].elemental);

      if (novoElemental !== null && novoElemental.trim() !== "") {
        fila[index].elemental = novoElemental;
        atualizarTabela();
      }
    }

    // Finalizar/Remover Jogador
    function removerJogador(index) {
      fila.splice(index, 1);
      atualizarTabela();
    }

    // Inicializa a tabela
    atualizarTabela();
  </script>
</body>
</html>

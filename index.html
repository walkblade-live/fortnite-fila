<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #ffffff;
      max-width: 800px;
      margin: 0 auto;
      padding: 10px;
    }

    h1 { 
      text-align: center; 
      color: #00d4ff; 
      font-size: 1.4rem; 
      margin: 15px 0;
    }

    h2 { 
      text-align: center; 
      color: #00d4ff; 
      font-size: 1.2rem; 
      margin-top: 0;
    }

    .card {
      background-color: #202024;
      padding: 15px 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #323238;
      background-color: #121214;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    button.btn-principal {
      background-color: #00d4ff;
      color: #121214;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    button.btn-principal:hover { background-color: #0099cc; }

    .aviso-pix {
      text-align: center;
      color: #ffffff;
      font-size: 0.85rem;
      margin-top: 8px;
      font-weight: 500;
    }

    /* AJUSTE RESPONSIVO DA TABELA PARA CELULAR */
    .table-responsive {
      width: 100%;
      overflow-x: hidden; /* Remove rolagem lateral para enquadrar na tela */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed; /* Força enquadramento perfeito na tela */
    }

    th, td {
      padding: 8px 4px;
      text-align: center;
      border-bottom: 1px solid #323238;
      word-wrap: break-word;
      font-size: 0.82rem;
    }

    th { background-color: #29292e; color: #00d4ff; }

    /* Larguras das colunas otimizadas para smartphone */
    th:nth-child(1), td:nth-child(1) { width: 12%; } /* Pos */
    th:nth-child(2), td:nth-child(2) { width: 30%; } /* Nick */
    th:nth-child(3), td:nth-child(3) { width: 28%; } /* Elemental */
    th:nth-child(4), td:nth-child(4) { width: 30%; } /* Chamadas/Status */

    .admin-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* ESTILOS PADRONIZADOS (PÍLULAS DE STATUS E BOTÕES TEMÁTICOS) */
    .badge-base {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .bolinha {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* STATUS: AGORA (VERDE) */
    .status-agora {
      background-color: #04d3611a;
      color: #04d361;
      border: 1px solid #04d361;
    }

    .bolinha-verde {
      background-color: #04d361;
      box-shadow: 0 0 8px #04d361;
    }

    /* STATUS: AGUARDANDO (AMARELO) */
    .status-aguardando {
      background-color: #fba94c1a;
      color: #fba94c;
      border: 1px solid #fba94c;
    }

    .bolinha-amarela {
      background-color: #fba94c;
      box-shadow: 0 0 8px #fba94c;
    }

    /* STATUS: FUROU A FILA (ROXO) */
    .status-furou {
      background-color: #9966ff1a;
      color: #a855f7;
      border: 1px solid #a855f7;
    }

    .bolinha-roxa {
      background-color: #a855f7;
      box-shadow: 0 0 8px #a855f7;
    }

    /* BOTÕES DO MODO ADMIN COMPACTOS */
    .btn-action {
      cursor: pointer;
      width: 100%;
      margin: 2px 0;
      padding: 3px 6px;
      font-size: 0.7rem;
    }

    .btn-action.btn-chamar {
      background-color: #04d3611a;
      color: #04d361;
      border: 1px solid #04d361;
    }

    .btn-action.btn-chamar:hover {
      background-color: #04d361;
      color: #121214;
    }

    .btn-action.btn-fura {
      background-color: #9966ff1a;

      border: 1px solid #a855f7;
    }

    .btn-action.btn-fura:hover {

    }

    .btn-action.btn-editar {

    }

    .btn-action.btn-editar:hover {

    .btn-action.btn-finalizar {

    }

    .btn-action.btn-finalizar:hover {
      background-color: #ff9933;

    }

    /* Destaque para a linha dos jogadores ativos */
    tr.jogador-ativo {
      background-color: #04d3610d;
    }

      background-color: #a855f70d;
    }
  </style>
</head>

  <!-- TABELA DA FILA -->
  <div class="card">

    </div>
    
    <h2>Fila Atual</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Nickname</th>
            <th>Elemental</th>
            <th>Status</th>

          <!-- Os inscritos aparecerão aqui automaticamente -->

  <!-- CONEXÃO FIREBASE EM TEMPO REAL -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB107R20K5NeJvEydhncZA0zJqe50MG9P4",
      authDomain: "walkblade-fila.firebaseapp.com",
      databaseURL: "https://walkblade-fila-default-rtdb.firebaseio.com",
      projectId: "walkblade-fila",
      storageBucket: "walkblade-fila.firebasestorage.app",
      messagingSenderId: "187103264773",
      appId: "1:187103264773:web:7e52f9294d72e4fa3c5c6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const filaRef = ref(db, 'fila');

    let isAdmin = false;
    const SENHA_ADMIN = "1574";

    const form = document.getElementById('filaForm');
    let listaKeys = []; 
    let filaLocal = []; 

    // Adicionar à Fila (No Firebase)
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const nick = document.getElementById('nickname').value;
      const elemental = document.getElementById('elemental').value;

      push(filaRef, {
        nick: nick,
        elemental: elemental,
        chamado: false,
        furaFila: false,
        furaFilaTime: 0,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('nickname').value = '';
        document.getElementById('elemental').value = '';
      });
    });

    // Escutar alterações do Firebase ao vivo
    onValue(filaRef, (snapshot) => {
      const itens = [];

      if (snapshot.exists()) {
        snapshot.forEach((child) => {
          itens.push({
            key: child.key,
            data: child.val()
          });
        });

        // Ordenação inteligente
        itens.sort((a, b) => {
          if (a.data.furaFila && !b.data.furaFila) return -1;
          if (!a.data.furaFila && b.data.furaFila) return 1;
          
          if (a.data.furaFila && b.data.furaFila) {
            return (a.data.furaFilaTime || 0) - (b.data.furaFilaTime || 0);
          }
          
          return (a.data.timestamp || 0) - (b.data.timestamp || 0);
        });
      }

      listaKeys = itens.map(item => item.key);
      filaLocal = itens.map(item => item.data);

      atualizarTabela();
    });

    // Atualizar visualização da tabela
    window.atualizarTabela = function() {
      const tabela = document.getElementById('tabelaFila');
      tabela.innerHTML = '';

      if (filaLocal.length === 0) {
        tabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Fila vazia no momento.</td></tr>`;
        return;
      }

      filaLocal.forEach((jogador, index) => {
        const tr = document.createElement('tr');

        if (jogador.chamado) {
          tr.classList.add('jogador-ativo');
        } else if (jogador.furaFila) {
          tr.classList.add('jogador-fura-fila');
        }

        let acoesHTML = '';
        
        if (isAdmin) {
          acoesHTML = `
            <button class="badge-base btn-action btn-chamar" onclick="chamarJogador(${index})">
              ${jogador.chamado ? 'Desmarcar' : 'Chamar'}
            </button>
            <button class="badge-base btn-action btn-fura" onclick="furarFilaJogador(${index})">
              ${jogador.furaFila ? '↩️ Normal' : '⚡ Fura Fila'}
            </button>
            <button class="badge-base btn-action btn-editar" onclick="editarElemental(${index})">✏️ Editar</button>
            <button class="badge-base btn-action btn-finalizar" onclick="removerJogador(${index})">Finalizar 🠳</button>
          `;
        } else {
          if (jogador.chamado) {
            acoesHTML = `<span class="badge-base status-agora"><span class="bolinha bolinha-verde"></span> Agora</span>`;
          } else if (jogador.furaFila) {
            acoesHTML = `<span class="badge-base status-furou"><span class="bolinha bolinha-roxa"></span> Furou</span>`;
          } else {
            acoesHTML = `<span class="badge-base status-aguardando"><span class="bolinha bolinha-amarela"></span> Espera</span>`;
          }
        }

        tr.innerHTML = `
          <td><strong>#${index + 1}</strong></td>
          <td><strong>${jogador.nick}</strong></td>
          <td>${jogador.elemental}</td>
          <td>${acoesHTML}</td>
        `;

        tabela.appendChild(tr);
      });
    };

    // Ativar Modo Admin
    window.toggleAdmin = function() {
      if (!isAdmin) {
        const senha = prompt("Digite a senha de Admin:");
        if (senha === SENHA_ADMIN) {
          isAdmin = true;
          document.getElementById('btnAdmin').innerText = "Sair do Modo Admin";
          alert("Modo Admin ativado!");
        } else if (senha !== null) {
          alert("Senha incorreta!");
        }
      } else {
        isAdmin = false;
        document.getElementById('btnAdmin').innerText = "Entrar como Host / Admin";
      }
      atualizarTabela();
    };

    // Chamar Jogador no Firebase
    window.chamarJogador = function(index) {
      const key = listaKeys[index];
      const novoStatus = !filaLocal[index].chamado;
      update(ref(db, `fila/${key}`), { chamado: novoStatus });
    };

    // Alternar status Fura Fila
    window.furarFilaJogador = function(index) {
      const key = listaKeys[index];
      const statusAtual = filaLocal[index].furaFila;
      
      update(ref(db, `fila/${key}`), { 
        furaFila: !statusAtual,
        furaFilaTime: !statusAtual ? Date.now() : 0 
      });
    };

    // Editar Elemental no Firebase
    window.editarElemental = function(index) {
      const key = listaKeys[index];
      const novoElemental = prompt(`Digite exatamente o novo elemental para ${filaLocal[index].nick}:`, filaLocal[index].elemental);

      if (novoElemental !== null && novoElemental.trim() !== "") {
        update(ref(db, `fila/${key}`), { elemental: novoElemental });
      }
    };

    // Remover do Firebase
    window.removerJogador = function(index) {
      const key = listaKeys[index];
      remove(ref(db, `fila/${key}`));
    };
  </script>
</body>
</html>
